<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SMART TRADE PRO</title>
    <script>
      // Applied before first paint so a saved light-mode preference doesn't
      // flash dark-then-light on load. Keep this key in sync with
      // src/context/ThemeContext.tsx's STORAGE_KEY.
      (function () {
        try {
          if (localStorage.getItem('smart-trade-pro:theme') === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
